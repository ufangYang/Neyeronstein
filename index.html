<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #05060a; color: #e8ecf3; overflow: hidden; }
  #ui { position: fixed; top: 0; left: 0; right: 0; z-index: 10; display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; background: rgba(8,10,16,0.5); backdrop-filter: blur(10px); border-bottom: 1px solid #141824; transition: opacity .4s; }
  body.present #ui { opacity: 0; pointer-events: none; }
  button { font-size: 14px; font-weight: 600; padding: 8px 14px; border-radius: 10px; border: 1px solid #2a3142; background: #141a28; color: #e8ecf3; cursor: pointer; }
  button:hover { background: #1e2740; }
  #modes { display: flex; background: #10131d; border: 1px solid #222a3a; border-radius: 10px; overflow: hidden; }
  #modes button { border: 0; border-radius: 0; background: transparent; padding: 8px 16px; }
  #modes button.on { background: #3b82f6; color: #fff; }
  #status { font-size: 13px; }
  .spacer { flex: 1; }
  #alpha { display:flex; align-items:center; gap:8px; font-size:13px; color:#9aa5b8; }
  #alphaBar { width:120px; height:8px; border-radius:6px; background:#141a28; border:1px solid #26304a; overflow:hidden; }
  #alphaFill { height:100%; width:0%; background:linear-gradient(90deg,#166534,#22c55e,#4ade80); transition:width .12s linear; }
  #eyes { font-size:12px; font-weight:700; padding:3px 9px; border-radius:20px; border:1px solid #26304a; color:#6b7488; white-space:nowrap; transition:all .2s; }
  #eyes.closed { color:#052e12; background:#22c55e; border-color:#22c55e; }
  #heart { display:flex; align-items:center; gap:6px; font-size:13px; color:#9aa5b8; font-variant-numeric:tabular-nums; }
  #heart .hh { color:#22c55e; font-size:16px; transition:transform .12s; display:inline-block; }
  a.link, button.link { font-size:13px; color:#e8ecf3; text-decoration:none; border:1px solid #3b82f6; background:#3b82f6; padding:8px 12px; border-radius:10px; cursor:pointer; }
  canvas { display: block; position: fixed; inset: 0; z-index: 2; }
  #wait { position: fixed; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; text-align: center; color: #6b7488; pointer-events: none; }
  #wait.hide { display: none; }
  #wait b { color: #aeb8c9; font-size: 20px; font-weight: 600; }
  #wait span { font-size: 14px; }
  #caption { position: fixed; left:0; right:0; bottom: 40px; z-index: 8; text-align:center; pointer-events:none; padding: 0 240px;
    font-size: 15px; letter-spacing:.5px; color:#aeb8c9; text-shadow:0 2px 18px #000; opacity:.85; transition:opacity .4s; }
  body.present #caption { opacity: 0; }
  body.present #caption.force { opacity: .92; }
  #mark { position: fixed; right: 14px; bottom: 10px; z-index: 8; font-size: 11px; letter-spacing: .3px;
    color: #7c8598; opacity: .75; pointer-events: none; text-shadow: 0 1px 10px #000; }
  body.present #mark { opacity: .45; }

</style>

<body>
  <div id="ui">
    <div id="modes">
      <button data-mode="bloom" class="on">Bloom</button>
      <button data-mode="plasma">Plasma</button>
      <button data-mode="spectrum">Spectrum</button>
      <button data-mode="butterfly">Butterfly</button>
      <button data-mode="drift">Drift</button>
      <button data-mode="sky">Sky</button>
      <button data-mode="veil">Veil</button>
    </div>
    <span id="status">Waiting for Control…</span>
    <div class="spacer"></div>
    <div id="alpha" title="Alpha power — jumps when you close your eyes">
      <span>α</span><div id="alphaBar"><div id="alphaFill"></div></div><span id="eyes">eyes open</span>
    </div>
    <div id="heart" title="Guided breath pace"><span class="hh">◯</span><span id="bpm">--</span></div>
    <button id="presentBtn" class="link">Present ⛶</button>
  </div>
  <canvas id="art"></canvas>
  <div id="caption"></div>
  <div id="wait">
    <b>Neyeronstein</b>
    <span>starting…</span>
  </div>
  <div id="mark">© 2026 Yu-Fang Yang · Neyeronstein</div>

<script type="module">
// ============================================================================
//  MuseGaze — VISUALISER. Pure receiver. Aesthetic target: Apple-Breathe calm —
//  soft overlapping translucent forms that breathe, clean color, no busy lines.
//  Bloom = brain-driven breathing rosette. Aurora = full-screen color field.
//  Spectrum = filled rainbow corona of the live 3–45 Hz spectrum. Sky = alpha opens a dusk.
//  Guided BREATH (not the heartbeat) makes everything breathe; alpha drives a
//  screen-wide bloom + an "eyes open/closed" badge — the canonical alpha tell.
// ============================================================================
const bus = new BroadcastChannel('musegaze');
const BANDS = ['Delta','Theta','Alpha','Beta','Gamma'];
const BAND_HUE = { Delta:265, Theta:217, Alpha:142, Beta:38, Gamma:0 };
const F = { Delta:0,Theta:0,Alpha:0,Beta:0,Gamma:0, FAA:0.5, TB:0.5, HRV:0.5, LZ:0.5 };
const Ftarget = { ...F };
let bpm=0, pulse=0, lastRx=-1e9, curState='Neutral', aGain=1, aManual=0, rThresh=0.65;  // rThresh: alpha level needed to earn the rainbow
let specTarget=new Array(49).fill(0), specDisp=new Array(49).fill(0);
let route={ size:'Alpha', speed:'Beta', ripple:'Theta', warmth:'FAA', glow:'HRV' };
// --- Plasma EEG-view state: per-band waveforms (from Control's filters) + band-power trends ---
const WBANDS=['Delta','Theta','Alpha','Beta','Gamma'];
const waveBuf={Delta:[],Theta:[],Alpha:[],Beta:[],Gamma:[],bb:[]}; const WAVE_MAX=1200;   // ~5s of samples
const trend={Delta:[],Theta:[],Alpha:[],Beta:[],Gamma:[],avg:[]}; const TREND_MAX=600;     // ~60s at 10Hz
const ga1s=[]; const GA_MAX=120; let gaSum=0,gaCnt=0,gaT=0;                                  // grand average, 1 point / second
let hpHz=1, plasmaView='waves', tgl={x:0,y:0,w:0,h:0};
bus.onmessage = (e) => { const m=e.data; if(!m||!m.f) return;
  for (const k in m.f) if (typeof m.f[k]==='number') Ftarget[k]=m.f[k];
  if (m.map) route=m.map;
  if (m.state) curState=m.state;
  if (m.spec) specTarget=m.spec;
  if (typeof m.aGain==='number') aGain=m.aGain;
  if (typeof m.aManual==='number') aManual=m.aManual;
  if (typeof m.rThresh==='number') rThresh=m.rThresh;
  if (typeof m.hpHz==='number') hpHz=m.hpHz;
  if (m.waves){ for(const k in waveBuf){ const a=m.waves[k]; if(a&&a.length){ const b=waveBuf[k]; for(let i=0;i<a.length;i++) b.push(a[i]); if(b.length>WAVE_MAX) waveBuf[k]=b.slice(-WAVE_MAX); } } }
  { let s=0; for(const k of WBANDS){ const v=(m.f&&typeof m.f[k]==='number')?m.f[k]:0; const tb=trend[k]; tb.push(v); if(tb.length>TREND_MAX) tb.shift(); s+=v; }
    const mb=s/5; trend.avg.push(mb); if(trend.avg.length>TREND_MAX) trend.avg.shift();
    gaSum+=mb; gaCnt++; const now=performance.now(); if(now-gaT>=1000){ ga1s.push(gaCnt?gaSum/gaCnt:0); if(ga1s.length>GA_MAX) ga1s.shift(); gaSum=0; gaCnt=0; gaT=now; } }
  bpm=m.bpm||0; if(m.pulse>pulse) pulse=m.pulse; lastRx=performance.now(); };
function easeSignals(){ for(const k in F) F[k]+=((Ftarget[k]??F[k])-F[k])*0.14;
  for(let k=0;k<49;k++) specDisp[k]+=((specTarget[k]||0)-specDisp[k])*0.18; }
function dominant(){ return BANDS.map(k=>[k,F[k]]).sort((a,b)=>b[1]-a[1]); }
function kv(name){ const k=route[name]; return (k&&k!=='none')?(F[k]||0):0; }

const canvas=document.getElementById('art'), ctx=canvas.getContext('2d');
function resize(){ canvas.width=innerWidth; canvas.height=innerHeight; initAurora(); } addEventListener('resize',resize);

// --- GUIDED BREATH: a smooth slow oscillator, NOT the unreliable PPG heartbeat.
let breathPhase=0;
function breathBpm(){ return curState==='Drowsy'?4.5 : curState==='Relaxed'?5.5 : curState==='Focused'?7.5 : curState==='Excited'?10 : 6.5; }
function stepBreath(){ breathPhase += Math.PI*2*(breathBpm()/60)/60; return 0.5+0.5*Math.sin(breathPhase); } // 0..1
function warm(){ return (kv('warmth')-0.5)*70; }

// --- ALPHA BLOOM: a screen-filling swell whose size+brightness track alpha.
let alphaSmooth=0;
function alphaBloom(breath,scale){
  scale = scale==null?1:scale;                       // butterfly/drift pass <1 so wing colour reads
  const w=canvas.width,h=canvas.height, a=alphaSmooth;
  if(a<0.03) return;
  ctx.globalCompositeOperation='screen';
  const r=Math.max(w,h)*(0.42+a*0.55)*(0.9+breath*0.16);
  const rg=ctx.createRadialGradient(w/2,h/2,0,w/2,h/2,r);
  rg.addColorStop(0,`hsla(158,80%,56%,${(0.05+a*0.24)*scale})`);
  rg.addColorStop(0.55,`hsla(166,78%,48%,${(0.02+a*0.10)*scale})`);
  rg.addColorStop(1,'hsla(170,78%,48%,0)');
  ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(w/2,h/2,r,0,Math.PI*2); ctx.fill();
  ctx.globalCompositeOperation='source-over';
}

// ---- BLOOM: Apple-Breathe-style rosette of soft overlapping translucent discs.
//  The whole flower expands on the in-breath and contracts on the out-breath;
//  alpha swells it (eyes-closed opens the bloom); FAA warms it; Beta spins it.
let bloomRot=0, bloomPhase=0;
// BLOOM — Apple-Breathe aesthetic: a rosette of soft, frosted, overlapping translucent
//  petals with gentle depth and slow motion. Still reads the Alpha↔Beta balance:
//  CALM (alpha) → petals open WIDE, warm mint→gold, few & large, serene & slow.
//  THINKING (beta) → petals draw in, cooler periwinkle→lavender, a few more, quicker.
//  Soft radial gradients + shadowBlur give the misty, luminous Apple feel (no hard lines).
function drawBloom(breath){
  const w=canvas.width,h=canvas.height;
  // soft graded backdrop for depth (very Apple)
  const bgv=ctx.createRadialGradient(w/2,h*0.44,0,w/2,h*0.44,Math.max(w,h)*0.8);
  bgv.addColorStop(0,'rgba(12,16,24,0.30)'); bgv.addColorStop(1,'rgba(4,5,9,0.34)');
  ctx.fillStyle=bgv; ctx.fillRect(0,0,w,h);
  const cx=w/2,cy=h/2, R=Math.min(w,h);
  let a=Math.min(1,alphaSmooth*1.7*aGain), effA=Math.min(1,alphaSmooth);   // a = petal openness (aGain-boosted); effA = TRUE alpha for the rainbow gate
  if(aManual>0.001){ a=aManual; effA=aManual; }        // manual preview overrides both (Control page)
  const b=Math.min(1,F.Beta*1.7);
  const bal=a/(a+b+0.001);                             // 1 = calm(alpha) · 0 = thinking(beta)
  bloomRot   += 0.0016 + b*0.011;                      // calm drifts slowly; thinking turns a little quicker
  const breathe = 0.93 + breath*0.13;
  const open    = R*(0.115 + a*0.13);                  // ring radius — ALPHA opens the rosette
  const petalR  = R*(0.135 + a*0.05)*breathe;          // soft petal radius (kept < ring so petals read)
  const petals  = Math.round(6 + (1-bal)*3);           // THINKING adds a couple of petals
  const hue     = 48 + (1-bal)*200;                    // CALM warm gold/amber → THINKING periwinkle
  const mag     = Math.min(1,(F.Delta+F.Theta+F.Alpha+F.Beta+F.Gamma)*0.4);  // overall power → colour INTENSITY
  const sat     = Math.round(48+mag*44);               // weak signal = pale/dreamy · strong = vivid
  ctx.globalCompositeOperation='source-over';          // translucent petals — pastel overlaps, no white blow-out
  for(let L=0; L<2; L++){                              // two layers → soft depth
    const lr=open*(1-L*0.30), pr=petalR*(1-L*0.14), rot=bloomRot*(L%2?-1:1);
    for(let i=0;i<petals;i++){
      const ang=rot + i/petals*Math.PI*2 + L*0.5;
      const px=cx+Math.cos(ang)*lr, py=cy+Math.sin(ang)*lr;
      const ph=(hue - 18 + i/petals*44 + L*6 +360)%360, A=(0.20+a*0.12)*(1-L*0.34)*(0.7+0.5*mag);
      ctx.save();
      ctx.shadowColor=`hsla(${ph},${sat}%,58%,0.5)`; ctx.shadowBlur=pr*0.7;   // fluffier frosted glow
      const rg=ctx.createRadialGradient(px,py,0,px,py,pr);
      rg.addColorStop(0,`hsla(${ph},${sat}%,74%,${A})`);
      rg.addColorStop(0.6,`hsla(${ph},${sat-6}%,62%,${A*0.55})`);
      rg.addColorStop(1,`hsla(${ph},${sat-8}%,56%,0)`);
      ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(px,py,pr,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
  }
  // --- defined luminous linework: petal outlines + a clear border + inner contour rings ---
  ctx.globalCompositeOperation='lighter';
  const lineHue=(hue+8)%360, outR=open+petalR*0.55;
  ctx.lineJoin='round';
  for(let i=0;i<petals;i++){ const ang=bloomRot + i/petals*Math.PI*2;    // petal outlines (flower-of-circles)
    const px=cx+Math.cos(ang)*open, py=cy+Math.sin(ang)*open;
    ctx.strokeStyle=`hsla(${lineHue},88%,84%,${0.10+a*0.22})`; ctx.lineWidth=Math.max(1,R*0.0016);
    ctx.beginPath(); ctx.arc(px,py,petalR*0.98,0,Math.PI*2); ctx.stroke(); }
  ctx.strokeStyle=`hsla(${lineHue},82%,80%,${0.12+a*0.24})`; ctx.lineWidth=Math.max(1.2,R*0.0022);  // clear outer border
  ctx.beginPath(); ctx.arc(cx,cy,outR,0,Math.PI*2); ctx.stroke();
  for(let k=1;k<=2;k++){ ctx.strokeStyle=`hsla(${lineHue},76%,82%,${0.06+a*0.12})`; ctx.lineWidth=Math.max(1,R*0.0013);
    ctx.beginPath(); ctx.arc(cx,cy,outR*(0.42+0.26*k),0,Math.PI*2); ctx.stroke(); }
  // --- interlocking rainbow CRESCENTS: earned only when TRUE alpha crosses the (adjustable) threshold ---
  const ro=Math.max(0,Math.min(1,(effA-rThresh)/Math.max(0.05,(1-rThresh)*0.6)));
  if(ro>0.01){ const er=outR*0.42, d=er*0.5, seg=54, rsat=Math.max(82,sat), gap=0.62;  // gap → open end
    const arcs=[ {ex:cx-d, gapAt:Math.PI},   // left crescent, opening faces left (outward)
                 {ex:cx+d, gapAt:0} ];        // right crescent, opening faces right (outward)
    ctx.globalCompositeOperation='source-over'; ctx.lineCap='round'; ctx.shadowBlur=0;
    for(const c of arcs){ ctx.strokeStyle=`rgba(6,8,14,${0.5*ro})`; ctx.lineWidth=Math.max(11,R*0.034); // dark backing
      ctx.beginPath(); ctx.arc(c.ex,cy,er, c.gapAt+gap, c.gapAt-gap+Math.PI*2); ctx.stroke(); }
    for(const c of arcs){ ctx.save();                                             // rainbow open C — diffuse + core
      const start=c.gapAt+gap, sweep=Math.PI*2-2*gap;
      ctx.shadowBlur=R*0.032; ctx.lineWidth=Math.max(11,R*0.032);                 // diffuse halo: wide, blurred, colours bleed
      for(let i=0;i<seg;i++){ const a0=start+i/seg*sweep, a1=start+(i+1)/seg*sweep;
        const hh=Math.round((i/seg*360 + bloomRot*28)%360);
        ctx.strokeStyle=`hsla(${hh},90%,66%,${0.34*ro})`; ctx.shadowColor=`hsla(${hh},95%,66%,0.65)`;
        ctx.beginPath(); ctx.arc(c.ex,cy,er,a0,a1+0.10); ctx.stroke(); }
      ctx.shadowBlur=R*0.012; ctx.lineWidth=Math.max(3,R*0.011);                  // soft core so it still reads
      for(let i=0;i<seg;i++){ const a0=start+i/seg*sweep, a1=start+(i+1)/seg*sweep;
        const hh=Math.round((i/seg*360 + bloomRot*28)%360);
        ctx.strokeStyle=`hsla(${hh},${rsat}%,72%,${0.6*ro})`; ctx.shadowColor='transparent';
        ctx.beginPath(); ctx.arc(c.ex,cy,er,a0,a1+0.07); ctx.stroke(); }
      ctx.restore(); }
    ctx.globalCompositeOperation='lighter'; }
  // gentle luminous core — warm gold when calm, cool lavender when thinking (soft, not blown out)
  const coreR=petalR*0.8, coreHue=(50+(1-bal)*190)%360;
  ctx.globalCompositeOperation='lighter';
  const core=ctx.createRadialGradient(cx,cy,0,cx,cy,coreR);
  core.addColorStop(0,`hsla(${coreHue},82%,80%,${(0.06+a*0.18)*(0.5+0.5*bal)})`);
  core.addColorStop(0.55,`hsla(${hue},68%,64%,${0.04+a*0.08})`);
  core.addColorStop(1,`hsla(${hue},66%,58%,0)`);
  ctx.fillStyle=core; ctx.beginPath(); ctx.arc(cx,cy,coreR,0,Math.PI*2); ctx.fill();
  ctx.globalCompositeOperation='source-over';
  if(aManual>0.001){ ctx.fillStyle='rgba(255,200,90,0.6)'; ctx.font=`600 ${Math.round(R*0.018)}px system-ui,-apple-system,sans-serif`;
    ctx.textAlign='left'; ctx.textBaseline='alphabetic';
    ctx.fillText('PREVIEW · manual override — set Bloom preview to 0 for live', 18, h-18); }
}

// ---- PLASMA: liquid-ink metaballs. Soft glowing blobs drift on organic paths and
//  merge like ink dropped in water; Alpha swells them, Beta quickens the flow, FAA
//  warms the palette. A faint trailing smear leaves inky wakes.
let plasmaBlobs=[], plasmaT=0;
const PLASMA_HUES=[275,240,205,175,150,40,320,190];
function initPlasma(){ plasmaBlobs=[];
  for(let i=0;i<8;i++) plasmaBlobs.push({
    sx:0.28+0.13*((i*0.7)%1), sy:0.24+0.11*((i*0.53)%1),
    ax:0.32+0.14*((i*0.37)%1), ay:0.32+0.14*((i*0.61)%1),
    px:i*0.9, py:i*1.7+1, hue:PLASMA_HUES[i%PLASMA_HUES.length] }); }
function initAurora(){ initPlasma(); }                 // (resize hook keeps the old name)
function rrect(x,y,wd,ht,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+wd,y,x+wd,y+ht,r); ctx.arcTo(x+wd,y+ht,x,y+ht,r); ctx.arcTo(x,y+ht,x,y,r); ctx.arcTo(x,y,x+wd,y,r); ctx.closePath(); }
// PLASMA (repurposed): live EEG per frequency band. Toggle between real band-pass WAVEFORMS
//  (filtered in Control) and band-POWER TRENDS over ~60s, plus a grand average (1 point/second).
function drawPlasma(breath){
  const w=canvas.width,h=canvas.height;
  ctx.globalCompositeOperation='source-over';
  const bg=ctx.createLinearGradient(0,0,0,h); bg.addColorStop(0,'#06080f'); bg.addColorStop(1,'#03040a');
  ctx.fillStyle=bg; ctx.fillRect(0,0,w,h);
  const COL={Delta:'#8b5cf6',Theta:'#3b82f6',Alpha:'#22c55e',Beta:'#f59e0b',Gamma:'#ef4444'};
  const RNG={Delta:'1–4',Theta:'4–8',Alpha:'8–13',Beta:'13–30',Gamma:'30–44'};
  const pad=Math.round(w*0.03), top=Math.round(h*0.15), grandH=Math.round(h*0.12), bottomM=Math.round(h*0.06);
  const areaH=h-top-grandH-bottomM, laneH=areaH/5, plotX=pad+Math.round(w*0.1), plotW=w-plotX-pad;
  ctx.lineJoin='round'; ctx.lineCap='round';
  for(let i=0;i<WBANDS.length;i++){ const k=WBANDS[i], yc=top+laneH*(i+0.5), col=COL[k];
    ctx.strokeStyle='rgba(255,255,255,0.05)'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(plotX,yc); ctx.lineTo(plotX+plotW,yc); ctx.stroke();
    ctx.textAlign='left'; ctx.textBaseline='alphabetic';
    ctx.fillStyle=col; ctx.font=`600 ${Math.round(h*0.024)}px system-ui,sans-serif`; ctx.fillText(k, pad, yc-Math.round(h*0.006));
    ctx.fillStyle='rgba(255,255,255,0.4)'; ctx.font=`${Math.round(h*0.015)}px system-ui,sans-serif`; ctx.fillText(RNG[k]+' Hz', pad, yc+Math.round(h*0.016));
    if(plasmaView==='waves'){ const buf=waveBuf[k];
      if(buf.length>2){ let mx=1e-6; for(let j=0;j<buf.length;j++){ const av=Math.abs(buf[j]); if(av>mx)mx=av; } const sc=(laneH*0.42)/mx;
        ctx.strokeStyle=col; ctx.lineWidth=Math.max(1.4,h*0.0022); ctx.shadowColor=col; ctx.shadowBlur=h*0.008; ctx.beginPath();
        const n=buf.length; for(let j=0;j<n;j++){ const x=plotX+plotW*(j/(n-1)); const y=yc-buf[j]*sc; j?ctx.lineTo(x,y):ctx.moveTo(x,y); }
        ctx.stroke(); ctx.shadowBlur=0; }
    } else { const buf=trend[k];
      if(buf.length>1){ const base=yc+laneH*0.42, n=buf.length;
        ctx.beginPath();
        for(let j=0;j<n;j++){ const x=plotX+plotW*(j/(TREND_MAX-1)); const y=base-Math.min(1,buf[j])*laneH*0.84; j?ctx.lineTo(x,y):ctx.moveTo(x,y); }
        ctx.strokeStyle=col; ctx.lineWidth=Math.max(1.4,h*0.0022); ctx.stroke();
        ctx.lineTo(plotX+plotW*((n-1)/(TREND_MAX-1)),base); ctx.lineTo(plotX,base); ctx.closePath(); ctx.fillStyle=col+'22'; ctx.fill(); }
    }
  }
  const gy=top+areaH+grandH*0.55;                                       // grand-average lane (per 1 s)
  ctx.strokeStyle='rgba(255,255,255,0.05)'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(plotX,gy); ctx.lineTo(plotX+plotW,gy); ctx.stroke();
  ctx.textAlign='left'; ctx.fillStyle='#e8ecf3'; ctx.font=`600 ${Math.round(h*0.022)}px system-ui,sans-serif`; ctx.fillText('Grand avg', pad, gy-Math.round(h*0.006));
  ctx.fillStyle='rgba(255,255,255,0.4)'; ctx.font=`${Math.round(h*0.015)}px system-ui,sans-serif`; ctx.fillText('per 1 s', pad, gy+Math.round(h*0.016));
  if(ga1s.length>1){ let mx=1e-6; for(const v of ga1s) if(v>mx)mx=v; const sc=(grandH*0.36)/mx, bw=plotW/GA_MAX;
    for(let j=0;j<ga1s.length;j++){ const x=plotX+plotW*(j/(GA_MAX-1)); const bh=ga1s[j]*sc; const hue=205-150*(ga1s[j]/mx);
      ctx.fillStyle=`hsl(${hue},72%,56%)`; ctx.fillRect(x-bw*0.3, gy-bh, Math.max(1.5,bw*0.6), bh); } }
  // toggle pill + high-pass readout
  const tw=Math.round(w*0.19), th=Math.round(h*0.05); tgl={x:pad,y:Math.round(h*0.075),w:tw,h:th}; const half=tw/2;
  ctx.fillStyle='rgba(255,255,255,0.07)'; rrect(tgl.x,tgl.y,tw,th,th*0.45); ctx.fill();
  ctx.fillStyle='rgba(90,130,255,0.55)'; rrect(plasmaView==='waves'?tgl.x:tgl.x+half,tgl.y,half,th,th*0.45); ctx.fill();
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font=`600 ${Math.round(h*0.019)}px system-ui,sans-serif`;
  ctx.fillStyle=plasmaView==='waves'?'#fff':'rgba(255,255,255,0.6)'; ctx.fillText('Waves', tgl.x+half*0.5, tgl.y+th*0.5);
  ctx.fillStyle=plasmaView==='trends'?'#fff':'rgba(255,255,255,0.6)'; ctx.fillText('Trends', tgl.x+half*1.5, tgl.y+th*0.5);
  ctx.textAlign='right'; ctx.fillStyle='rgba(255,255,255,0.45)'; ctx.font=`${Math.round(h*0.018)}px system-ui,sans-serif`;
  ctx.fillText('High-pass '+(hpHz||0).toFixed(1)+' Hz', w-pad, tgl.y+th*0.5);
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
}

// ---- SPECTRUM: the live 3–45 Hz spectrum as a FILLED rainbow corona (color = the
//  frequency it came from), tip lights, and a soft core — fills the frame, no thin
//  spokes, no gaps. Sub-3 Hz drift is dropped upstream in Control, so no giant spikes.
let specSpin=0;
function drawSpectrum2(breath){
  const w=canvas.width,h=canvas.height; ctx.fillStyle='rgba(4,6,14,0.16)'; ctx.fillRect(0,0,w,h);
  const cx=w/2,cy=h/2, S=specDisp, R=Math.min(w,h), N=200, brS=0.94+breath*0.12;
  specSpin += 0.003 + F.Beta*0.012;                    // slow rotation so it's alive even on steady input
  const base=(R*0.13*brS)+F.Alpha*R*0.10, amp=R*0.40*(0.8+breath*0.4);   // amplitude breathes
  const pts=[];
  for(let a=0;a<=N;a++){ const fk=3+a/N*41, k=Math.floor(fk), frac=fk-k;
    const raw=(S[k]||0)*(1-frac)+(S[k+1]||0)*frac, v=Math.pow(raw,0.68);   // gamma lift: reveal weak bins
    const ang=a/N*Math.PI*2 - Math.PI/2 + specSpin, hue=(280-(fk-3)/41*280 + specSpin*40 +360)%360;  // rotating rainbow
    pts.push({ang,r1:base+v*amp,hue,v}); }
  // soft central disc so the middle is never an empty hole
  const core=ctx.createRadialGradient(cx,cy,0,cx,cy,base*1.1);
  core.addColorStop(0,`hsla(190,70%,55%,${0.06+F.Alpha*0.10})`); core.addColorStop(1,'hsla(230,70%,50%,0)');
  ctx.globalCompositeOperation='screen'; ctx.fillStyle=core; ctx.beginPath(); ctx.arc(cx,cy,base*1.1,0,Math.PI*2); ctx.fill();
  // filled rainbow wedges — solid saturated corona (normal blend keeps colours vivid, not white)
  ctx.globalCompositeOperation='source-over';
  for(let a=0;a<N;a++){ const p=pts[a],q=pts[a+1];
    const bx0=cx+Math.cos(p.ang)*base, by0=cy+Math.sin(p.ang)*base, bx1=cx+Math.cos(q.ang)*base, by1=cy+Math.sin(q.ang)*base;
    const ox0=cx+Math.cos(p.ang)*p.r1, oy0=cy+Math.sin(p.ang)*p.r1, ox1=cx+Math.cos(q.ang)*q.r1, oy1=cy+Math.sin(q.ang)*q.r1;
    ctx.beginPath(); ctx.moveTo(bx0,by0); ctx.lineTo(ox0,oy0); ctx.lineTo(ox1,oy1); ctx.lineTo(bx1,by1); ctx.closePath();
    ctx.fillStyle=`hsla(${p.hue},85%,55%,${0.5+p.v*0.4})`; ctx.fill(); }
  // glowing outer rim (additive, so only the edge blooms)
  ctx.globalCompositeOperation='lighter';
  ctx.beginPath(); pts.forEach((p,i)=>{ const x=cx+Math.cos(p.ang)*p.r1,y=cy+Math.sin(p.ang)*p.r1; i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
  ctx.lineJoin='round'; ctx.strokeStyle='hsla(190,90%,72%,0.35)'; ctx.lineWidth=2.5; ctx.stroke();
  // tip lights every few bins (sparkle)
  for(let a=0;a<N;a+=6){ const p=pts[a]; if(p.v<0.06) continue; const x=cx+Math.cos(p.ang)*p.r1,y=cy+Math.sin(p.ang)*p.r1;
    ctx.fillStyle=`hsla(${p.hue},95%,76%,${0.35+p.v*0.45})`; ctx.beginPath(); ctx.arc(x,y,1.4+p.v*2.6,0,Math.PI*2); ctx.fill(); }
  // alpha ring — swells eyes-closed
  ctx.strokeStyle=`hsla(142,88%,64%,${0.22+F.Alpha*0.55})`; ctx.lineWidth=2+F.Alpha*12;
  ctx.beginPath(); ctx.arc(cx,cy,base,0,Math.PI*2); ctx.stroke();
  ctx.globalCompositeOperation='source-over';
  alphaBloom(breath);
}

// ---- BUTTERFLY / DRIFT: a shapely butterfly rests on a flower. CALM (high alpha, low beta) → wings
//  held open and still, large and luminous. AROUSAL (Beta+Gamma) → wings flap, faster the higher it
//  goes. Alpha swells its size. The central butterfly behaves the same in BOTH modes.
//  SWARM — extra butterflies spawn and fly around the central one:
//   · Butterfly mode (variant 'gamma') → arousal (Beta+Gamma) rises → an energetic warm-hued flock
//     that darts and flutters fast, more of them the higher arousal climbs.
//   · Drift mode    (variant 'theta') → theta rises → a dreamy violet flight that drifts slowly
//     upward on gentle sine paths, wings gliding, more of them the deeper theta goes.
let flapPhase=0;
function wingPath(fore,s){ ctx.beginPath();     // right-side wing (mirror via negative x-scale)
  if(fore){ ctx.moveTo(0,-0.07*s);              // fuller, more graceful forewing
    ctx.bezierCurveTo(0.22*s,-0.66*s, 0.64*s,-0.74*s, 0.82*s,-0.44*s);
    ctx.bezierCurveTo(0.96*s,-0.18*s, 0.78*s,0.04*s, 0.34*s,0.02*s);
    ctx.bezierCurveTo(0.16*s,0.0*s, 0.05*s,-0.03*s, 0,-0.07*s);
  } else { ctx.moveTo(0,0.03*s);                // rounder hindwing
    ctx.bezierCurveTo(0.30*s,0.05*s, 0.58*s,0.32*s, 0.54*s,0.64*s);
    ctx.bezierCurveTo(0.50*s,0.90*s, 0.14*s,0.86*s, 0.04*s,0.46*s);
    ctx.bezierCurveTo(0.0*s,0.24*s, -0.01*s,0.09*s, 0,0.03*s);
  } ctx.closePath(); }
function drawOneButterfly(cx,cy,s,wingOpen,hueC,op){
  // Beautiful iridescent butterfly: layered colour + directional light sheen + an iridescent
  //  flash, a main vein with finer ribs, soft hindwing eyespots, crisp margin, segmented body.
  const sh=((hueC-255)+360)%360;                    // brain state nudges the whole colour ramp
  ctx.save(); ctx.lineJoin='round'; ctx.lineCap='round';
  for(const fore of [false,true]){                 // hindwings behind, forewings in front
    for(const side of [-1,1]){
      ctx.save(); ctx.translate(cx,cy); ctx.scale(side*wingOpen,1);
      const bx=0.05*s, by=(fore?-0.06:0.06)*s;
      // (a) base iridescent fill with a soft drop shadow for depth
      ctx.save();
      ctx.shadowColor=`hsla(${(275+sh)%360},55%,10%,${0.55*op})`; ctx.shadowBlur=s*0.15; ctx.shadowOffsetY=s*0.02;
      wingPath(fore,s);
      const g=ctx.createRadialGradient(bx,by,0,bx,by,s*1.06);
      g.addColorStop(0.00,`hsla(${(46+sh*0.15)%360},95%,74%,${0.98*op})`);   // warm gold core
      g.addColorStop(0.26,`hsla(${(52+sh*0.15)%360},88%,60%,${0.96*op})`);
      g.addColorStop(0.48,`hsla(${(186+sh)%360},74%,56%,${0.96*op})`);       // cyan band
      g.addColorStop(0.68,`hsla(${(250+sh)%360},78%,54%,${0.97*op})`);       // deep blue-violet
      g.addColorStop(0.86,`hsla(${(288+sh)%360},80%,52%,${0.96*op})`);       // purple
      g.addColorStop(1.00,`hsla(${(324+sh)%360},86%,60%,${0.9*op})`);        // rose margin
      ctx.fillStyle=g; ctx.fill();
      ctx.restore();
      // interior lighting + detail, clipped to the wing
      ctx.save(); wingPath(fore,s); ctx.clip();
      // (b) directional light sheen (dimensionality)
      const sheen=ctx.createLinearGradient(-0.15*s,(fore?-0.7:-0.1)*s, 0.85*s,(fore?0.15:0.85)*s);
      sheen.addColorStop(0,`hsla(50,100%,94%,${0.32*op})`);
      sheen.addColorStop(0.4,`hsla(190,95%,82%,${0.10*op})`);
      sheen.addColorStop(0.75,`hsla(280,80%,60%,0)`);
      ctx.globalCompositeOperation='screen'; ctx.fillStyle=sheen; ctx.fillRect(-s,-1.4*s,2.7*s,2.8*s);
      // (c) iridescent flash spot (catches the light like a morpho)
      const fx=(fore?0.32:0.24)*s, fy=(fore?-0.30:0.34)*s;
      const fl=ctx.createRadialGradient(fx,fy,0,fx,fy,s*0.4);
      fl.addColorStop(0,`hsla(195,100%,92%,${0.34*op})`); fl.addColorStop(1,`hsla(195,100%,92%,0)`);
      ctx.fillStyle=fl; ctx.beginPath(); ctx.arc(fx,fy,s*0.4,0,Math.PI*2); ctx.fill();
      ctx.globalCompositeOperation='source-over';
      // (d) venation: a bolder main vein + finer secondary ribs
      ctx.strokeStyle=`hsla(${(286+sh)%360},42%,18%,${0.24*op})`; ctx.lineWidth=Math.max(0.9,s*0.011);
      const mex=(fore?0.72:0.5)*s, mey=(fore?-0.5:0.62)*s;
      ctx.beginPath(); ctx.moveTo(bx,by); ctx.quadraticCurveTo(mex*0.5,mey*0.55,mex,mey); ctx.stroke();
      ctx.strokeStyle=`hsla(${(286+sh)%360},38%,22%,${0.13*op})`; ctx.lineWidth=Math.max(0.5,s*0.006);
      const vn=fore?4:3;
      for(let i=0;i<vn;i++){ const t=(i+0.5)/vn; const ex=(fore?0.76:0.54)*s, ey=(fore?(-0.6+t*0.6):(0.08+t*0.64))*s;
        ctx.beginPath(); ctx.moveTo(bx,by); ctx.quadraticCurveTo(ex*0.5,ey*0.6,ex,ey); ctx.stroke(); }
      // (e) soft eyespots — hindwing only, tasteful
      if(!fore){ for(const [dx,dy] of [[0.34,0.5],[0.19,0.6]]){ const x=dx*s,y=dy*s;
        const eg=ctx.createRadialGradient(x,y,0,x,y,s*0.055);
        eg.addColorStop(0,`hsla(46,96%,92%,${0.55*op})`);
        eg.addColorStop(0.5,`hsla(300,55%,18%,${0.42*op})`);
        eg.addColorStop(1,`hsla(300,55%,18%,0)`);
        ctx.fillStyle=eg; ctx.beginPath(); ctx.arc(x,y,s*0.055,0,Math.PI*2); ctx.fill(); } }
      ctx.restore();
      // (f) crisp margin + bright edge highlight
      wingPath(fore,s); ctx.strokeStyle=`hsla(${(288+sh)%360},48%,15%,${0.5*op})`; ctx.lineWidth=Math.max(1,s*0.014); ctx.stroke();
      wingPath(fore,s); ctx.strokeStyle=`hsla(${(196+sh)%360},92%,88%,${0.3*op})`; ctx.lineWidth=Math.max(0.5,s*0.005); ctx.stroke();
      ctx.restore();
    }
  }
  // warm thorax glow where the wings meet
  const cg=ctx.createRadialGradient(cx,cy,0,cx,cy,s*0.42);
  cg.addColorStop(0,`hsla(64,82%,76%,${0.16*op})`); cg.addColorStop(1,`hsla(64,82%,76%,0)`);
  ctx.fillStyle=cg; ctx.beginPath(); ctx.arc(cx,cy,s*0.42,0,Math.PI*2); ctx.fill();
  // slim tapered body, segmented, with a soft central sheen
  const bodyR=s*0.032, bTop=cy-s*0.46;
  const bg=ctx.createLinearGradient(cx-bodyR,0,cx+bodyR,0);
  bg.addColorStop(0,`rgba(10,10,16,${op})`); bg.addColorStop(0.4,`rgba(44,42,58,${op})`);
  bg.addColorStop(0.55,`rgba(112,108,132,${0.95*op})`); bg.addColorStop(1,`rgba(10,10,16,${op})`);
  ctx.fillStyle=bg; ctx.beginPath(); ctx.ellipse(cx,cy+s*0.04,bodyR,s*0.5,0,0,Math.PI*2); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.ellipse(cx,cy+s*0.04,bodyR,s*0.5,0,0,Math.PI*2); ctx.clip();
  ctx.strokeStyle=`rgba(8,8,14,${0.45*op})`; ctx.lineWidth=Math.max(0.6,s*0.006);
  for(let i=0;i<8;i++){ const yy=cy-s*0.36+i*s*0.13; ctx.beginPath(); ctx.moveTo(cx-bodyR,yy); ctx.lineTo(cx+bodyR,yy); ctx.stroke(); }
  ctx.restore();
  // fuzzy thorax
  ctx.fillStyle=`rgba(32,30,42,${0.55*op})`; ctx.beginPath(); ctx.ellipse(cx,cy-s*0.18,bodyR*1.5,s*0.15,0,0,Math.PI*2); ctx.fill();
  // head + delicate clubbed antennae
  ctx.fillStyle=`rgba(18,18,26,${op})`; ctx.beginPath(); ctx.arc(cx,bTop,s*0.05,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle=`rgba(24,24,34,${0.92*op})`; ctx.lineWidth=Math.max(1,s*0.012);
  for(const t of [-1,1]){ ctx.beginPath(); ctx.moveTo(cx,bTop-s*0.02);
    ctx.quadraticCurveTo(cx+t*s*0.14,cy-s*0.86,cx+t*s*0.20,cy-s*0.78); ctx.stroke();
    ctx.fillStyle=`rgba(24,24,34,${0.92*op})`; ctx.beginPath(); ctx.arc(cx+t*s*0.20,cy-s*0.78,s*0.022,0,Math.PI*2); ctx.fill(); }
  ctx.restore();
}
function drawFlower(cx,by,fs){
  // ELEGANT soft bloom: translucent layered petals with radial falloff, a glowing
  //  center (no hard dotted ring), slender stem — painterly, not clip-art.
  const h=canvas.height;
  ctx.save();
  ctx.strokeStyle='rgba(78,128,92,0.45)'; ctx.lineWidth=fs*0.055; ctx.lineCap='round';   // slender stem
  ctx.beginPath(); ctx.moveTo(cx,h); ctx.quadraticCurveTo(cx-fs*0.5,(by+h)/2,cx,by+fs*0.14); ctx.stroke();
  ctx.save(); ctx.translate(cx-fs*0.42,(by+h)/2-fs*0.16); ctx.rotate(-0.7);                // soft leaf
  const lg=ctx.createLinearGradient(-fs*0.6,0,fs*0.6,0);
  lg.addColorStop(0,'rgba(80,140,96,0)'); lg.addColorStop(0.5,'rgba(104,168,110,0.45)'); lg.addColorStop(1,'rgba(80,140,96,0)');
  ctx.fillStyle=lg; ctx.beginPath(); ctx.ellipse(0,0,fs*0.6,fs*0.2,0,0,Math.PI*2); ctx.fill(); ctx.restore();
  // two staggered rings of translucent petals
  for(let layer=0; layer<2; layer++){
    const petals=8, off=layer*Math.PI/petals, spread=fs*(0.34-layer*0.05), plen=fs*(0.44-layer*0.06);
    for(let i=0;i<petals;i++){ const a=i/petals*Math.PI*2+off;
      ctx.save(); ctx.translate(cx+Math.cos(a)*spread, by+Math.sin(a)*spread); ctx.rotate(a);
      const pg=ctx.createRadialGradient(fs*0.06,0,0,fs*0.30,0,plen*1.4);
      pg.addColorStop(0,`hsla(344,70%,92%,${0.30-layer*0.06})`);
      pg.addColorStop(0.55,`hsla(340,66%,78%,${0.46-layer*0.08})`);
      pg.addColorStop(1,`hsla(334,60%,64%,0)`);              // translucent tip
      ctx.fillStyle=pg; ctx.beginPath(); ctx.ellipse(fs*0.26,0,plen,fs*0.17,0,0,Math.PI*2); ctx.fill(); ctx.restore(); }
  }
  // luminous soft center, no hard dots
  const cg=ctx.createRadialGradient(cx,by,0,cx,by,fs*0.36);
  cg.addColorStop(0,'hsla(46,96%,84%,0.92)'); cg.addColorStop(0.5,'hsla(42,90%,64%,0.6)'); cg.addColorStop(1,'hsla(38,85%,52%,0)');
  ctx.fillStyle=cg; ctx.beginPath(); ctx.arc(cx,by,fs*0.36,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
// -- swarm: a pool of little butterflies whose count tracks the driving band.
let swarm=[], spawnAcc=0; const SWARM_MAX=7;                     // FEW butterflies — calm, not a cloud
function swarmDrive(variant){                                    // 0..1 target intensity
  return variant==='theta' ? Math.min(1, F.Theta*1.4)
                           : Math.min(1,(F.Beta+F.Gamma)*0.95);
}
function makeFly(variant){
  const w=canvas.width,h=canvas.height,R=Math.min(w,h);
  const f={ x:Math.random()*w, y:Math.random()*h, style:variant,
    s:R*(0.05+Math.random()*0.035), flap:Math.random()*Math.PI*2,   // BIGGER, softer
    phase:Math.random()*Math.PI*2, drift:Math.random()*Math.PI*2, op:0 };
  if(variant==='gamma'){                                         // warm, but gentle float (not darting)
    f.vx=(Math.random()-0.5)*R*0.0008; f.vy=-R*(0.0003+Math.random()*0.0006);
    f.hue=28+Math.random()*40;                                  // amber→coral
  } else {                                                       // cool, dreamy
    f.vx=(Math.random()-0.5)*R*0.0007; f.vy=-R*(0.0004+Math.random()*0.0007);
    f.hue=250+Math.random()*60;                                 // violet→blue
  }
  return f;
}
function stepFly(f,drive){
  const w=canvas.width,h=canvas.height,R=Math.min(w,h);
  f.phase += 0.012 + drive*0.02;                                 // gentle wing beat for both
  f.drift += 0.006;
  f.flap += f.style==='gamma' ? (0.08+drive*0.16) : (0.05+drive*0.07);
  f.x += f.vx + Math.sin(f.drift*1.1)*R*0.0006;                  // soft floating drift, no jitter
  f.y += f.vy + Math.cos(f.drift*0.9)*R*0.0004;
  if(f.x<-0.08*w) f.x=1.08*w; else if(f.x>1.08*w) f.x=-0.08*w;   // wrap around edges
  if(f.y<-0.08*h) f.y=1.08*h; else if(f.y>1.08*h) f.y=-0.08*h;
}
function updateSwarm(variant){
  const drive=swarmDrive(variant), target=Math.round(drive*SWARM_MAX);
  spawnAcc += 0.18;                                              // slow, graceful arrival
  if(swarm.length<target && spawnAcc>=1){ spawnAcc=0; swarm.push(makeFly(variant)); }
  for(let i=0;i<swarm.length;i++){ const f=swarm[i];
    f.dying = i>=target;                                         // over target → fade the newest out
    stepFly(f,drive);
    const tOp = f.dying?0:0.85;
    f.op += (tOp-f.op)*0.04;                                     // slow fade in/out (calm)
  }
  swarm = swarm.filter(f=> !(f.dying && f.op<0.03));
  return drive;
}
function drawSwarmFly(f){
  // soft, ROUND, glowing little butterfly — gentle flap, no banking/streaks
  const open=0.55+0.45*(0.5-0.5*Math.cos(f.flap));              // wings breathe 0.55↔1
  const s=f.s, op=f.op;
  ctx.save(); ctx.translate(f.x,f.y);
  ctx.globalCompositeOperation='lighter';
  ctx.shadowColor=`hsla(${f.hue},85%,66%,0.55)`; ctx.shadowBlur=s*0.5;   // soft halo
  for(const side of [-1,1]) for(const fore of [true,false]){
    const wx=side*s*0.42*open, wy=fore?-s*0.28:s*0.34;
    const rw=(fore?0.5:0.44)*s, rh=(fore?0.44:0.4)*s, hue=fore?f.hue:(f.hue+20)%360;
    ctx.save(); ctx.translate(wx,wy); ctx.scale(open,1);
    const rg=ctx.createRadialGradient(0,0,0,0,0,Math.max(rw,rh));
    rg.addColorStop(0,`hsla(${hue},92%,80%,${op})`);
    rg.addColorStop(0.6,`hsla(${hue},86%,64%,${op*0.55})`);
    rg.addColorStop(1,`hsla(${hue},84%,58%,0)`);
    ctx.fillStyle=rg; ctx.beginPath(); ctx.ellipse(0,0,rw,rh,0,0,Math.PI*2); ctx.fill(); ctx.restore();
  }
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle=`hsla(${f.hue},38%,18%,${op*0.7})`;             // soft slim body
  ctx.beginPath(); ctx.ellipse(0,0,s*0.06,s*0.34,0,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
function drawButterfly(breath, variant){
  const w=canvas.width,h=canvas.height;
  ctx.globalCompositeOperation='source-over'; ctx.fillStyle='rgba(7,8,16,0.32)'; ctx.fillRect(0,0,w,h);
  const cx=w/2, R=Math.min(w,h);
  updateSwarm(variant);
  const arousal=Math.min(1,(F.Beta+F.Gamma)*1.15);
  flapPhase += 0.12 + arousal*0.6;                               // still when calm, quick flap when aroused
  const wingOpen = Math.max(0.16, 1 - arousal*(0.5 - 0.5*Math.cos(flapPhase)));
  const s = R*(0.17 + F.Alpha*0.11) * (0.94+breath*0.08);        // bigger + serener with alpha
  const cy = h/2 - R*0.06;                                       // butterfly sits a little above centre
  const blossomY = cy + s*0.62 + s*0.55;                         // flower just under the body
  const hueC = (255 - warm() + 360)%360;                         // violet-blue, FAA warms it
  for(const f of swarm) drawSwarmFly(f);                         // flock behind the hero butterfly
  ctx.globalCompositeOperation='lighter';                        // soft aura, grows with alpha
  const gl=ctx.createRadialGradient(cx,cy,0,cx,cy,s*1.8);
  gl.addColorStop(0,`hsla(${hueC},80%,60%,${0.04+F.Alpha*0.16})`); gl.addColorStop(1,`hsla(${hueC},80%,55%,0)`);
  ctx.fillStyle=gl; ctx.beginPath(); ctx.arc(cx,cy,s*1.8,0,Math.PI*2); ctx.fill();
  ctx.globalCompositeOperation='source-over';
  drawFlower(cx, blossomY, s*0.62);
  drawOneButterfly(cx, cy, s, wingOpen, hueC, 1);
  alphaBloom(breath, 0.5);                                       // gentle so the wing colours stay vivid
}

// ============================================================================
//  SKY (replaces Scenes, 2026-08-23) — a bare tree in silhouette against a
//  Monet dusk. The palette is FIXED violet→rose; alpha never shifts the hue,
//  it WIDENS the colour: the rose field climbs the sky, the halo behind the
//  canopy opens, the diffusion softens and the motes rise. Eyes closed and the
//  whole sky opens outward. Beta only quickens the drift of the cloud fields.
// ============================================================================
let skyT=0, skyClouds=[], skyStars=[], skyMotes=[];
function seedRnd(s){ let x=(s>>>0)||1; return ()=>{ x^=x<<13; x>>>=0; x^=x>>>17; x^=x<<5; x>>>=0; return x/4294967296; }; }
function initSky(){
  const R=seedRnd(20260823);
  // Clouds are real patches, not washes: each is a run of overlapping lobes, wider
  // than tall, lit from below by the horizon so the underside catches the rose.
  skyClouds=[];
  for(let i=0;i<8;i++){
    const n=5+Math.floor(R()*4), lobes=[];
    for(let j=0;j<n;j++) lobes.push({ dx:(j/(n-1)-0.5)*2+(R()-0.5)*0.22, dy:(R()-0.5)*0.66, r:0.46+R()*0.54 });
    skyClouds.push({ x:R(), y:0.14+R()*0.66, w:0.18+R()*0.26, hue:203+R()*32,
      ph:R()*6.283, sp:0.09+R()*0.20, dir:R()<0.5?-1:1, lobes });
  }
  skyStars=[];  for(let i=0;i<80;i++) skyStars.push({ x:R(), y:R()*0.62, r:0.4+R()*1.4, ph:R()*6.283, sp:0.5+R()*1.5 });
  skyMotes=[];  for(let i=0;i<30;i++) skyMotes.push({ x:R(), y:R(), s:0.4+R()*0.7, ph:R()*6.283, sp:0.10+R()*0.16, dr:(R()-0.5)*0.5 });
}
// One tree, regrown identically every frame from a fixed seed; only the sway differs.
function skyBranch(x,y,len,ang,wd,d,sway,R){
  if(d>9||len<3.2) return;
  const a=ang+sway*(0.02+d*0.028)*Math.sin(skyT*0.75+d*0.85);
  const x2=x+Math.cos(a)*len, y2=y+Math.sin(a)*len;
  const bow=len*0.07*(d%2?1:-1);
  ctx.lineWidth=Math.max(0.55,wd); ctx.beginPath(); ctx.moveTo(x,y);
  ctx.quadraticCurveTo(x+Math.cos(a)*len*0.5-Math.sin(a)*bow, y+Math.sin(a)*len*0.5+Math.cos(a)*bow, x2, y2);
  ctx.stroke();
  const n=(d<2)?2:(R()<0.30?3:2);
  for(let i=0;i<n;i++){
    const spread=(0.30+R()*0.40)*((i%2)?1:-1)+(R()-0.5)*0.20;
    skyBranch(x2,y2,len*(0.66+R()*0.15), a+spread, wd*0.64, d+1, sway, R);
  }
}
// ============================================================================
//  VEIL (2026-08-23) — light through rippled glass falling down a wall, with the
//  water caustics it throws across the floor.
//
//  The thing that makes a caustic look like a caustic, rather than like a wavy
//  line, is that brightness is the INVERSE of how fast the light is being swept
//  sideways. Where the ribbon runs vertically the rays pile up and it flares;
//  where it slants they smear out and it dims and widens. So each segment is
//  drawn with brightness ∝ 1/(1+slant) and width ∝ slant, slant being |dx/dy|.
//  That single relation buys the bright cusps at the folds for free.
//
//  ALPHA CONTROLS SPEED, not width. Calm slows the whole field almost to a stop;
//  an alert brain keeps it moving. Width is now constant, so the composition does
//  not breathe in and out. A small brightness lift stays on alpha, because pure
//  speed is hard to read from the back of a room and the piece still needs one
//  change an audience can name.
//  Beta tightens the ripple · Theta drifts the field downward · breath sways it.
// ============================================================================
let veilT=0, veilRibs=[], veilBloom=null, veilBctx=null, veilLayer=null, veilLctx=null,
    veilCau=null, veilCctx=null, veilCimg=null, veilFrame=0;
const CAU_W=160, CAU_H=64;
function initVeil(){
  const R=seedRnd(31415);
  veilRibs=[];
  // Five ribbons, not seven, and LOW spatial frequency: about two and a half lazy
  // undulations down the whole frame. The first version ran 11–16 cycles and read
  // as scribble — glass ripples are long and slow, and the eye wants to follow one
  // curve from ceiling to floor rather than count wiggles.
  // Smoke, not tubes. What separates a plume from a ribbon is that it is SEVERAL
  // thin filaments that splay apart, converge, and dissolve in places. So every
  // ribbon carries three strands whose lateral offset itself varies with height,
  // plus a dissolve envelope that lets stretches of it fade to nothing.
  for(let i=0;i<5;i++){
    const strands=[];
    for(let j=0;j<3;j++) strands.push({
      o:(j-1)*(0.014+R()*0.016),          // lateral offset at rest
      ko:0.7+R()*1.1, po:R()*6.283, so:0.04+R()*0.05,   // how that offset breathes with height
      w:0.0020+R()*0.0026, b:0.55+R()*0.55 });
    veilRibs.push({
      x:0.16+i*0.170+(R()-0.5)*0.045, a:0.022+R()*0.018,   // lateral wander ~10% of width
      k1:1.3+R()*0.9, k2:2.7+R()*1.3, k3:5.0+R()*2.0,
      p1:R()*6.283, p2:R()*6.283, p3:R()*6.283,
      s1:0.09+R()*0.06, s2:0.13+R()*0.07, s3:0.17+R()*0.09,
      kd:0.7+R()*1.0, pd:R()*6.283, sd:0.06+R()*0.06,      // the dissolve, under one cycle per frame
      w:0.0030+R()*0.0034, br:0.72+R()*0.5, strands });
  }
  if(!veilCau){ veilCau=document.createElement('canvas'); veilCau.width=CAU_W; veilCau.height=CAU_H;
    veilCctx=veilCau.getContext('2d'); veilCimg=veilCctx.createImageData(CAU_W,CAU_H); }
}
// The ribbons are drawn into a HALF-RESOLUTION layer, never onto the main canvas
// directly, and never read back off it. Reading the main canvas to build a glow
// forces a GPU→CPU round trip and can stall a frame on real hardware. Instead the
// layer is composited twice — once tiny and stretched (the glow), once at size —
// and the upscaling filter supplies the softness for free.
function veilLayerCanvas(w,h){
  const lw=Math.max(64,Math.round(w/2)), lh=Math.max(64,Math.round(h/2));
  if(!veilLayer){ veilLayer=document.createElement('canvas'); veilLctx=veilLayer.getContext('2d'); }
  if(veilLayer.width!==lw||veilLayer.height!==lh){ veilLayer.width=lw; veilLayer.height=lh; }
  return veilLayer;
}
function veilBloomCanvas(w,h){
  const bw=Math.max(24,Math.round(w/10)), bh=Math.max(16,Math.round(h/10));
  if(!veilBloom){ veilBloom=document.createElement('canvas'); veilBctx=veilBloom.getContext('2d'); }
  if(veilBloom.width!==bw||veilBloom.height!==bh){ veilBloom.width=bw; veilBloom.height=bh; }
  return veilBloom;
}
// Floor caustics: two crossed travelling wave fields, sharpened with a high power
// so the bright parts collapse into thin filaments instead of soft blobs.
// Perspective lives in the SAMPLING COORDINATES, not in how the rows are drawn.
// Scaling each output row by a different factor makes the pattern fan out into
// visible triangles. Instead every pixel is projected onto a ground plane first —
// z = 1/(k + t) — and the wave field is evaluated in those world coordinates, so
// the floor can be blitted as one plain rectangle with no seams and no fan.
function veilCaustic(a,be){
  const d=veilCimg.data, t=veilT;
  for(let v=0;v<CAU_H;v++){
    const tv=v/(CAU_H-1);
    const z=1.0/(0.13+tv*0.92);                     // 7.7 far → 1.0 near
    const fade=Math.min(1, 0.22+tv*1.05);           // distant floor reads dimmer
    const wy=z*3.4;
    for(let u=0;u<CAU_W;u++){
      const wx=(u/CAU_W-0.5)*z*7.0;
      const n = Math.sin(wx*0.90+t*0.62) + Math.sin(wy*1.05-t*0.44) + Math.sin((wx+wy)*0.55+t*0.31);
      const m = Math.sin(wx*0.62-t*0.37) + Math.sin(wy*0.78+t*0.51);
      let c = Math.max(0, Math.sin(wx*0.50 + n*1.45)); c*=c; c*=c; c*=c;          // ^8
      let e = Math.max(0, Math.sin(wy*0.66 + m*1.20)); e*=e; e*=e;                // ^4
      const val = Math.min(1, (c + e*0.42) * (0.30+a*0.85) * fade);
      const i=(v*CAU_W+u)*4;
      d[i]=234*val; d[i+1]=243*val; d[i+2]=255*val; d[i+3]=255*val;
    }
  }
  veilCctx.putImageData(veilCimg,0,0);
}
function drawVeil(breath){
  const w=canvas.width,h=canvas.height;
  if(!veilRibs.length) initVeil();
  const a=Math.min(1, alphaSmooth*1.7), be=F.Beta||0, th=F.Theta||0;
  // ALPHA → SPEED. Calm nearly stops the field; alert keeps it moving. The range is
  // 4:1, which is large enough that a room notices the change without being told.
  veilT += (0.030 - a*0.026) + be*0.010;
  const drift = veilT*(0.05+th*0.14);                      // theta slides the whole veil down
  // Breath sway is deliberately SMALL. It runs on its own oscillator, independent of
  // alpha, so at full amplitude it swamped the slowdown and measured motion barely
  // changed. The second term rides veilT, so it slows with everything else.
  const sway  = (breath-0.5)*0.006 + Math.sin(veilT*0.11)*0.012;
  const floorY = Math.round(h*0.70);

  // 1 — the room. Warm neutral wall, cooler in the corners, a darker floor below.
  // The tonal relationship that makes this read as DAYLIGHT rather than as a lamp:
  // the wall is warm greige, the light falling on it is cooler than the wall. Reverse
  // that and the whole thing turns into stage lighting. So the plaster carries the
  // warmth and every luminous element below is a cool white.
  const wg=ctx.createLinearGradient(0,0,0,floorY);
  wg.addColorStop(0,'#2b2724'); wg.addColorStop(0.30,'#544c45');
  wg.addColorStop(0.68,'#6d635a'); wg.addColorStop(1,'#5e554e');
  ctx.fillStyle=wg; ctx.fillRect(0,0,w,floorY);
  const fg=ctx.createLinearGradient(0,floorY,0,h);
  fg.addColorStop(0,'#4a443e'); fg.addColorStop(0.45,'#3a3531'); fg.addColorStop(1,'#282523');
  ctx.fillStyle=fg; ctx.fillRect(0,floorY,w,h-floorY);
  // a cool daylight wash from the upper left, so the room has a source
  const dl=ctx.createRadialGradient(w*0.16,-h*0.10,0,w*0.16,-h*0.10,Math.max(w,h)*0.95);
  dl.addColorStop(0,`rgba(188,208,236,${0.10+a*0.07})`);
  dl.addColorStop(0.5,`rgba(168,190,222,${0.04+a*0.03})`);
  dl.addColorStop(1,'rgba(150,175,210,0)');
  ctx.fillStyle=dl; ctx.fillRect(0,0,w,floorY);

  // 2 — the ribbons, into the half-res layer. Wide faint halo pass, then the core.
  // Each ribbon is a FILLED BAND, not a stroked line. Stroking it segment by
  // segment beaded badly: under 'screen' the round caps overlap and every joint
  // brightened into a dot. A polygon whose half-width follows the Jacobian, filled
  // with a vertical gradient carrying the brightness down its length, gives the
  // same physics with a continuous edge. Three nested passes make it soft.
  const lc=veilLayerCanvas(w,floorY), L=veilLctx, sx=lc.width/w, sy=lc.height/floorY;
  L.clearRect(0,0,lc.width,lc.height);
  L.globalCompositeOperation='screen';
  const STEPS=120;
  const HALO={k:3.4,o:0.085}, BODY={k:1.45,o:0.20}, CORE={k:0.44,o:1.0};
  const xs=new Float64Array(STEPS+1), ys=new Float64Array(STEPS+1),
        hw=new Float64Array(STEPS+1), br=new Float64Array(STEPS+1);
  const SMOKE='218,236,248';                              // pale cyan, the colour smoke reads as
  function veilFill(p,tint){                              // one polygon + its brightness gradient
    const g=L.createLinearGradient(0,0,0,lc.height);
    for(let s=0;s<=STEPS;s+=6){
      const v=Math.min(0.92, br[s]*p.o);
      g.addColorStop(s/STEPS, `rgba(${tint},${v.toFixed(3)})`);
    }
    L.fillStyle=g; L.beginPath();
    L.moveTo(xs[0]+hw[0]*p.k, ys[0]);
    for(let s=1;s<=STEPS;s++) L.lineTo(xs[s]+hw[s]*p.k, ys[s]);
    for(let s=STEPS;s>=0;s--) L.lineTo(xs[s]-hw[s]*p.k, ys[s]);
    L.closePath(); L.fill();
  }
  for(const r of veilRibs){
    const amp=r.a;                                        // width no longer tracks alpha
    for(let si=0; si<r.strands.length; si++){
      const st=r.strands[si];
      for(let s=0;s<=STEPS;s++){
        const yn=s/STEPS, yy=yn+drift;
        ys[s]=yn*lc.height;
        // the strand's own offset breathes with height, so the three splay and re-gather
        const off=st.o*(0.35+1.3*Math.sin(st.ko*yy+st.po+veilT*st.so));
        xs[s]=(r.x + sway + off + amp*( Math.sin(r.k1*yy+r.p1+veilT*r.s1)
                                      + 0.45*Math.sin(r.k2*yy+r.p2-veilT*r.s2)
                                      + 0.17*Math.sin(r.k3*yy+r.p3+veilT*r.s3) ))*lc.width;
      }
      for(let s=0;s<=STEPS;s++){
        const yn=s/STEPS;
        const i0=Math.max(0,s-1), i1=Math.min(STEPS,s+1);
        // |dx/dy| — clamped, because at a near-horizontal fold it runs away
        const slant=Math.min(2.4, Math.abs(xs[i1]-xs[i0])/(Math.abs(ys[i1]-ys[i0])+1e-6));
        hw[s]=lc.width*st.w*(1.0+slant*2.6);              // smears where it sweeps
        // dissolve: stretches of the filament fade out entirely, the way smoke thins
        const dis=0.58+0.42*Math.sin(r.kd*(yn+drift)+r.pd+veilT*r.sd);   // thins, never breaks
        // and it never meets the frame edge hard
        const env=Math.min(1, yn/0.14)*(1-0.55*Math.max(0,(yn-0.78)/0.22));
        br[s]=r.br*st.b*(0.50+a*0.42)*dis*env/(1+slant*2.2);
      }
      if(si===1) veilFill(HALO,SMOKE);                    // one halo per ribbon, on the middle strand
      veilFill(BODY,SMOKE);
      veilFill(CORE,'236,248,255');
    }
  }
  L.globalCompositeOperation='source-over';

  // 3 — composite: the glow (layer squeezed to a tenth and stretched back), then
  //     the layer itself. Both on 'screen', so light adds rather than covers.
  ctx.globalCompositeOperation='screen';
  const bc=veilBloomCanvas(w,floorY);
  veilBctx.clearRect(0,0,bc.width,bc.height);
  veilBctx.drawImage(lc,0,0,lc.width,lc.height,0,0,bc.width,bc.height);
  ctx.globalAlpha=0.30+a*0.24;
  ctx.drawImage(bc,0,0,bc.width,bc.height,0,0,w,floorY);
  ctx.globalAlpha=1;
  ctx.drawImage(lc,0,0,lc.width,lc.height,0,0,w,floorY);

  // 4 — the floor. Caustic field in perspective: far rows narrow and dim, near
  //     rows wide and bright, so the light lies down on the ground.
  if((veilFrame++&1)===0) veilCaustic(a,be);
  ctx.globalAlpha=0.34+a*0.44;
  ctx.drawImage(veilCau,0,0,CAU_W,CAU_H,0,floorY,w,h-floorY);
  ctx.globalAlpha=1;

  // 5 — each ribbon lays a soft pool of its own light on the floor beneath it
  for(const r of veilRibs){
    const amp=r.a*(0.50+a*1.15);
    const yy=1+drift;
    const x=(r.x + sway + amp*( Math.sin(r.k1*yy+r.p1+veilT*r.s1)
                              + 0.45*Math.sin(r.k2*yy+r.p2-veilT*r.s2)
                              + 0.17*Math.sin(r.k3*yy+r.p3+veilT*r.s3) ))*w;
    // A soft radial pool, NOT a trapezoid — hard-edged wedges fanned across the
    // floor and read as geometry rather than as light.
    const pr=w*0.16*(0.7+a*0.6), py=floorY+(h-floorY)*0.34;
    const rg=ctx.createRadialGradient(x,py,0,x,py,pr);
    rg.addColorStop(0,`rgba(226,238,255,${0.05+a*0.14})`);
    rg.addColorStop(0.45,`rgba(212,226,246,${0.02+a*0.055})`);
    rg.addColorStop(1,'rgba(200,216,240,0)');
    ctx.fillStyle=rg; ctx.beginPath(); ctx.ellipse(x,py,pr,pr*0.42,0,0,Math.PI*2); ctx.fill();
  }
  ctx.globalCompositeOperation='source-over';

  // 6 — the seam where wall meets floor, and a vignette so the room has corners
  const sm=ctx.createLinearGradient(0,floorY-h*0.05,0,floorY+h*0.03);
  sm.addColorStop(0,'rgba(10,9,9,0)'); sm.addColorStop(0.72,'rgba(10,9,9,0.42)'); sm.addColorStop(1,'rgba(10,9,9,0)');
  ctx.fillStyle=sm; ctx.fillRect(0,floorY-h*0.05,w,h*0.08);
  const vg=ctx.createRadialGradient(w/2,h*0.46,Math.min(w,h)*0.30,w/2,h*0.46,Math.max(w,h)*0.80);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,`rgba(6,5,5,${0.56-a*0.14})`);
  ctx.fillStyle=vg; ctx.fillRect(0,0,w,h);
}

function drawSky(breath){
  const w=canvas.width,h=canvas.height;
  if(!skyClouds.length) initSky();
  skyT += 0.0055 + (F.Beta||0)*0.009;                       // beta only quickens the drift
  const a=Math.min(1, alphaSmooth*1.7);                     // display gain so modest alpha already reads
  const spread=0.16+a*0.52;                                 // how far up the rose field climbs
  const horizon=h*0.84, cx=w*0.52;

  // 1 — the sky itself. A blue hour, not a night: deep cobalt above, cerulean, then
  //     periwinkle, with the rose only at the hem. Hue is anchored at every alpha;
  //     alpha changes the reach of the rose and lifts the whole frame a little.
  const g=ctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0,    `hsl(224,${52+a*8}%,${11+a*7}%)`);
  g.addColorStop(0.34, `hsl(212,${56+a*10}%,${18+a*11}%)`);
  g.addColorStop(Math.max(0.40,Math.min(0.84,1-spread*0.78)), `hsl(232,${52+a*12}%,${25+a*14}%)`);
  g.addColorStop(0.88, `hsl(318,${48+a*18}%,${31+a*20}%)`);
  g.addColorStop(1,    `hsl(338,${50+a*16}%,${27+a*17}%)`);
  ctx.fillStyle=g; ctx.fillRect(0,0,w,h);

  // 2 — stars, only in the upper sky; they surface as the sky opens.
  ctx.globalCompositeOperation='screen';
  for(const s of skyStars){
    const tw=0.5+0.5*Math.sin(skyT*s.sp*3+s.ph);
    const op=(0.05+a*0.30)*tw; if(op<0.02) continue;
    ctx.fillStyle=`hsla(205,55%,94%,${op})`;
    ctx.beginPath(); ctx.arc(s.x*w, s.y*h*0.9, s.r*(0.7+a*0.6), 0, Math.PI*2); ctx.fill();
  }

  // 3 — cloud patches. Each is a run of soft lobes with a body and a lit underside,
  //     so they read as cloud rather than haze. Monet still: no edge is ever hard.
  for(const c of skyClouds){
    const px=(((c.x + c.dir*skyT*c.sp*0.05)%1.4+1.4)%1.4-0.2)*w;
    const py=(c.y + Math.sin(skyT*c.sp*0.8+c.ph)*0.022)*h;
    const cw=w*c.w*(0.86+spread*0.44)*(0.97+breath*0.05), chh=cw*0.33;
    const near=Math.max(0, 1-Math.abs(py-horizon)/(h*0.72));   // low clouds catch more of the glow
    const body=(0.12+a*0.26)*(0.78+0.22*Math.sin(skyT*0.45+c.ph));
    const lit =(0.05+a*0.26)*near;
    for(const l of c.lobes){
      const lx=px+l.dx*cw*0.5, ly=py+l.dy*chh*0.5, r=l.r*chh;
      const rg=ctx.createRadialGradient(lx,ly-r*0.18,0,lx,ly,r);
      rg.addColorStop(0,   `hsla(${c.hue},70%,${74+a*8}%,${body})`);
      rg.addColorStop(0.48,`hsla(${c.hue+10},66%,${64+a*8}%,${body*0.46})`);
      rg.addColorStop(1,   `hsla(${c.hue+18},62%,58%,0)`);
      ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(lx,ly,r,0,Math.PI*2); ctx.fill();
      if(lit>0.012){                                            // rose caught on the underside
        const ur=r*0.72, uy=ly+r*0.34;
        const ug=ctx.createRadialGradient(lx,uy,0,lx,uy,ur);
        ug.addColorStop(0,  `hsla(330,86%,78%,${lit})`);
        ug.addColorStop(0.5,`hsla(316,78%,70%,${lit*0.40})`);
        ug.addColorStop(1,  'hsla(300,70%,64%,0)');
        ctx.fillStyle=ug; ctx.beginPath(); ctx.arc(lx,uy,ur,0,Math.PI*2); ctx.fill();
      }
    }
  }

  // 4 — the horizon glow behind the tree. This is the widening: it opens with alpha.
  const hr=Math.max(w,h)*(0.26+a*0.52)*(0.95+breath*0.09);
  const hg=ctx.createRadialGradient(cx,horizon,0,cx,horizon,hr);
  hg.addColorStop(0,    `hsla(334,86%,76%,${0.10+a*0.30})`);
  hg.addColorStop(0.28, `hsla(310,78%,68%,${0.05+a*0.15})`);
  hg.addColorStop(0.58, `hsla(258,74%,64%,${0.02+a*0.07})`);
  hg.addColorStop(1,    'hsla(212,76%,60%,0)');
  ctx.fillStyle=hg; ctx.beginPath(); ctx.arc(cx,horizon,hr,0,Math.PI*2); ctx.fill();
  ctx.globalCompositeOperation='source-over';

  // 5 — the tree, near-black so the sky reads through the branches.
  const scale=Math.min(w,h);
  ctx.save();
  ctx.strokeStyle='rgba(10,14,30,0.93)'; ctx.lineCap='round'; ctx.lineJoin='round';   // blue-black, not dead black
  ctx.shadowColor=`hsla(326,84%,70%,${0.22+a*0.44})`; ctx.shadowBlur=scale*(0.010+a*0.030);
  const sway=0.55+breath*0.35;
  skyBranch(cx, horizon+scale*0.045, scale*0.172, -Math.PI/2, scale*0.021, 0, sway, seedRnd(7717));
  ctx.shadowBlur=0;
  // ground: a low soft band so the trunk is planted, not floating
  const gr=ctx.createLinearGradient(0,horizon-scale*0.02,0,h);
  gr.addColorStop(0,'rgba(14,20,44,0)'); gr.addColorStop(0.35,'rgba(13,19,42,0.70)'); gr.addColorStop(1,'rgba(8,12,28,0.95)');
  ctx.fillStyle=gr; ctx.fillRect(0,horizon-scale*0.02,w,h-horizon+scale*0.02);
  ctx.restore();

  // 6 — motes rising through the branches; more of them the wider the sky opens.
  ctx.globalCompositeOperation='screen';
  const nM=Math.round(a*skyMotes.length);
  for(let i=0;i<nM;i++){ const m=skyMotes[i];
    const my=((m.y - skyT*m.sp*0.05)%1+1)%1;
    const mx=m.x + Math.sin(skyT*0.5+m.ph)*0.02*m.dr*10;
    const rr=scale*0.0022*m.s*(1+a*0.5), R6=rr*3.2;
    const op=0.06+a*0.20;
    const rg=ctx.createRadialGradient(mx*w,my*h,0,mx*w,my*h,R6);
    rg.addColorStop(0,`hsla(324,80%,88%,${op})`); rg.addColorStop(0.45,`hsla(312,74%,78%,${op*0.35})`); rg.addColorStop(1,'hsla(300,70%,70%,0)');
    ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(mx*w,my*h,R6,0,Math.PI*2); ctx.fill();
  }

  // 7 — a final soft wash over everything: the diffusion Monet gets from wet paper.
  const bl=ctx.createRadialGradient(cx,horizon*0.94,0,cx,horizon*0.94,Math.max(w,h)*(0.5+a*0.5));
  bl.addColorStop(0,`hsla(318,70%,66%,${0.015+a*0.05})`); bl.addColorStop(1,'hsla(280,60%,50%,0)');
  ctx.fillStyle=bl; ctx.fillRect(0,0,w,h);
  ctx.globalCompositeOperation='source-over';

  // 8 — vignette, so the projector edge falls away instead of ending
  const vg=ctx.createRadialGradient(w/2,h*0.52,Math.min(w,h)*0.28,w/2,h*0.52,Math.max(w,h)*0.78);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,`rgba(6,10,26,${0.44-a*0.16})`);
  ctx.fillStyle=vg; ctx.fillRect(0,0,w,h);
}

let mode='bloom'; const modeBox=document.getElementById('modes');
modeBox.addEventListener('click', e => { const btn=e.target.closest('button'); if(!btn) return;
  mode=btn.dataset.mode; [...modeBox.children].forEach(c=>c.classList.toggle('on',c===btn));
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(mode==='plasma') initPlasma();
  swarm=[]; spawnAcc=0;                                          // fresh flock per mode (gamma↔theta differ)
  if(mode==='sky') initSky(); if(mode==='veil') initVeil(); });
canvas.addEventListener('click', e=>{ if(mode!=='plasma') return;          // tap the pill to switch Waves ↔ Trends
  const r=canvas.getBoundingClientRect(); const x=(e.clientX-r.left)*canvas.width/r.width, y=(e.clientY-r.top)*canvas.height/r.height;
  if(x>=tgl.x&&x<=tgl.x+tgl.w&&y>=tgl.y&&y<=tgl.y+tgl.h) plasmaView=(plasmaView==='waves'?'trends':'waves'); });

const statusEl=document.getElementById('status'), bpmEl=document.getElementById('bpm'),
      heartGlyph=document.querySelector('#heart .hh'), waitEl=document.getElementById('wait'),
      alphaFill=document.getElementById('alphaFill'), eyesEl=document.getElementById('eyes'),
      captionEl=document.getElementById('caption');
const CAPTION={ bloom:'Calm (alpha) opens a warm bloom · thinking (beta) tightens it cool',
  plasma:'Live EEG per band · tap Waves / Trends · high-pass set in Control',
  spectrum:'Your live 3–45 Hz spectrum · color = frequency · green ring = alpha',
  butterfly:'Calm holds the wings still · arousal flaps them & summons an energetic flock',
  drift:'Theta deepens · dreamy butterflies drift in',
  sky:'Alpha widens the sky · close your eyes and the colour opens through the branches',
  veil:'Light through rippled glass · calm slows the smoke almost to rest' };

// ============================================================================
//  PUBLIC DEMONSTRATION
//  The published page carries no Bluetooth code and no link to Control. If nothing
//  has been broadcast for a few seconds it runs a SIMULATED signal so a visitor
//  sees the work move rather than a dead screen, and it says so on the page. It
//  stands down the instant a real Control window starts broadcasting on this
//  machine, so the same file serves both the website and the live performance.
//
//  The label is not optional. A page showing invented brain data without saying so
//  would misrepresent the work, which is the opposite of what this piece is for.
// ============================================================================
let demoOn=false, demoT=0;
function demoStep(dt){
  demoT+=dt;
  const cycle=Math.sin(demoT*2*Math.PI/26);          // a slow eyes-open / eyes-closed rhythm
  const closed=Math.max(0,cycle);
  Ftarget.Alpha = Math.max(0, 0.09 + closed*0.62 + Math.sin(demoT*0.90)*0.030);
  Ftarget.Theta = Math.max(0, 0.22 + Math.max(0,-cycle)*0.20 + Math.sin(demoT*0.31)*0.050);
  Ftarget.Beta  = Math.max(0, 0.38 - closed*0.22 + Math.sin(demoT*0.53)*0.050);
  Ftarget.Delta = Math.max(0, 0.26 + Math.sin(demoT*0.17)*0.060);
  Ftarget.Gamma = Math.max(0, 0.10 + Math.sin(demoT*0.71)*0.040);
  Ftarget.FAA   = 0.5 + Math.sin(demoT*0.13)*0.16;
  Ftarget.TB=0.5; Ftarget.HRV=0.5; Ftarget.LZ=0.5;
  curState = closed>0.45 ? 'Relaxed' : (Ftarget.Beta>0.42 ? 'Focused' : 'Neutral');
  for(let k=0;k<49;k++){
    if(k<3){ specTarget[k]=0; continue; }
    const al=Math.exp(-Math.pow((k-10)/2.2,2))*Ftarget.Alpha*1.45;
    const th=Math.exp(-Math.pow((k- 6)/2.0,2))*Ftarget.Theta*0.90;
    const bt=Math.exp(-Math.pow((k-20)/6.0,2))*Ftarget.Beta *0.50;
    specTarget[k]=Math.min(1, al+th+bt+0.05);
  }
}

resize();
let lastTick=performance.now(), pageStart=performance.now();
function tick(){
  const now0=performance.now(), dt=Math.min(0.1,(now0-lastTick)/1000); lastTick=now0;
  const rx=now0-lastRx<3000;
  demoOn = !rx && (now0-pageStart)>4000;      // give a real Control four seconds to appear
  if(demoOn) demoStep(dt);
  const breath=stepBreath();
  easeSignals();
  alphaSmooth += (F.Alpha - alphaSmooth)*0.12;
  pulse*=0.90; heartGlyph.style.transform=`scale(${1+(breath-0.5)*0.5})`;
  const w=canvas.width,h=canvas.height;
  if(mode==='bloom') drawBloom(breath);
  else if(mode==='plasma') drawPlasma(breath);
  else if(mode==='spectrum') drawSpectrum2(breath);
  else if(mode==='butterfly') drawButterfly(breath,'gamma');
  else if(mode==='drift') drawButterfly(breath,'theta');
  else if(mode==='sky') drawSky(breath);                 // its own violet palette — no green alpha bloom
  else if(mode==='veil') drawVeil(breath);               // white caustic light — no green alpha bloom either
  const aPct=Math.min(100,alphaSmooth*140);
  alphaFill.style.width=aPct+'%';
  const closed=alphaSmooth>0.32;
  eyesEl.textContent=closed?'eyes closed':'eyes open'; eyesEl.classList.toggle('closed',closed);
  captionEl.textContent = rx ? (CAPTION[mode]||'')
                          : demoOn ? ((CAPTION[mode]||'')+'  ·  simulated signal, no headband connected') : '';
  captionEl.classList.toggle('force',closed);
  statusEl.textContent = rx ? ('Receiving ✓ · '+curState)
                        : demoOn ? ('Simulated signal · '+curState) : 'starting…';
  statusEl.style.color = rx?'#22c55e' : demoOn?'#8b95a8' : '#5b647a';
  bpmEl.textContent=(rx||demoOn)?(breathBpm().toFixed(0)+' br/min'):'--';
  waitEl.classList.toggle('hide', rx||demoOn);
  requestAnimationFrame(tick); }

document.getElementById('presentBtn').addEventListener('click', () => {
  document.body.classList.toggle('present');
  if(!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); });

window.__muse = { bus, F, state: () => ({ lastRx, bpm, alpha:alphaSmooth, mode, swarm:swarm.length }) };
window.__swarmLen = () => swarm.length;
tick();
</script>
